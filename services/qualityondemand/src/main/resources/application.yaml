spring:
  application:
    name: qualityondemand
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  # Leave unset fields out: the spec's optional ones (device, startedAt, expiresAt, statusInfo, ...) aren't nullable
  jackson:
    default-property-inclusion: non_null
  # Sessions are kept here; the Helm chart runs a Redis next to the service unless told to use another
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  # Tokens are checked against this issuer's discovery document and signing keys,
  # e.g. http://localhost:8180/realms/camara. Its "iss" must match tokens' exactly.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:}

camara:
  # One log line per API request (method, path, status, CAMARA code, duration, client); actuator,
  # Swagger UI and the spec files are left out (camara.access-log.exclude)
  access-log:
    enabled: ${ACCESS_LOG_ENABLED:true}
  auth:
    # false: no token needed (lab only); true needs AUTH_ISSUER_URI
    enabled: ${AUTH_ENABLED:true}
    # Claim that carries the subscriber's phone number in three-legged tokens
    phone-number-claim: ${AUTH_PHONE_NUMBER_CLAIM:phone_number}
  qod:
    # The SCS/AS id this service creates TEP AS sessions with QoS under
    scs-as-id: ${QOD_SCS_AS_ID:camara-qod}
    # Where TEP notifies this service of a session the network ended; TEP appends /notifications. Must be
    # reachable from TEP, e.g. http://<release>-qualityondemand:8080/tep-notifications (the chart's default)
    notification-destination: ${QOD_NOTIFICATION_DESTINATION:http://localhost:9091/tep-notifications}
    # This API's public root, the source of the CloudEvents sent to a session's sink
    api-root: ${QOD_API_ROOT:http://localhost:9091}
    # How often expired sessions are looked for, and when a TEP delete that failed is tried again
    expiry-check-interval: ${QOD_EXPIRY_CHECK_INTERVAL:5s}
    expiry-retry-delay: ${QOD_EXPIRY_RETRY_DELAY:30s}
    # false stops looking for expired sessions on this instance
    expiry-enabled: ${QOD_EXPIRY_ENABLED:true}
    # How long a session that ended is still answered (UNAVAILABLE) before it is gone; the spec asks for 360s
    terminated-retention: ${QOD_TERMINATED_RETENTION:360s}
    # Connect and read timeout of a notification to a session's sink
    sink-timeout: ${QOD_SINK_TIMEOUT:5s}

# The Helm chart sets 8080. Swagger UI's "Try it out" calls the address the spec was loaded from, on any port.
server:
  port: ${SERVER_PORT:9091}
  shutdown: graceful

tep:
  base-url: ${TEP_BASE_URL:http://localhost:9999/tep-api/v1}
  connect-timeout: ${TEP_CONNECT_TIMEOUT:2s}
  read-timeout: ${TEP_READ_TIMEOUT:5s}

# Actuator lives on its own port so it is never exposed through the public ingress
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    java:
      enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    # Unmatched paths are in the access log already, masked; this logger would print them raw
    org.springframework.web.servlet.PageNotFound: error

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  # Swagger UI shows the CAMARA spec itself (static/), not the docs springdoc derives from the controllers
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /
    url: /quality-on-demand.yaml
