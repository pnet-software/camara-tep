{{- /*
  The Redis the service keeps its sessions in, one per release, when redis.enabled. Its pods are labelled
  <name>-redis, so the service's own Service, PDB and HPA don't select them.
*/}}
{{- if .Values.redis.enabled }}
{{- $fullname := include "camara-lib.fullname" . }}
{{- $redisName := printf "%s-redis" (include "camara-lib.name" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "camara-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $redisName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "camara-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # One Redis at a time on its data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $redisName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $redisName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: camara
    spec:
      {{- with include "camara-lib.imagePullSecrets" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      # The official image's redis user
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["sh", "-c"]
          # The password comes from the environment, so it never appears in the pod spec
          args:
            - >-
              exec redis-server --dir /data
              {{- if .Values.redis.persistence.enabled }} --appendonly yes{{ else }} --save '' --appendonly no{{ end }}
              {{- if .Values.redis.auth.enabled }} --requirepass "$REDIS_PASSWORD"{{ end }}
          {{- if .Values.redis.auth.enabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-redis" $fullname) .Values.redis.auth.existingSecret }}
                  key: {{ .Values.redis.auth.existingSecretKey }}
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-redis" $fullname) .Values.redis.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if and .Values.redis.persistence.enabled (not .Values.redis.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "camara-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- end }}
{{- if and .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "camara-lib.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
data:
  {{ .Values.redis.auth.existingSecretKey }}: {{ required "redis.auth.password is required with redis.auth.enabled and no redis.auth.existingSecret" .Values.redis.auth.password | b64enc | quote }}
{{- end }}
{{- end }}
