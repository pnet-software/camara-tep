# Turns every optional template on so `helm lint` / `helm template` cover them in CI
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: reachability.ci.local
      paths:
        - path: /device-reachability-status
          pathType: Prefix
  tls:
    - hosts:
        - reachability.ci.local
      secretName: reachability-tls
autoscaling:
  enabled: true
serviceMonitor:
  enabled: true
imagePullSecrets:
  - name: registry-pull
extraEnv:
  - name: EXAMPLE
    value: "1"
config:
  authIssuerUri: https://keycloak.ci.local/realms/camara
  extra:
    EXAMPLE_SETTING: "1"
